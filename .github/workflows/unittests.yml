name: "Unittests"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: |
            "3.15"
            "3.12"
      # 3.12 is used by the Python (not docker) azure function
      - name: Run the Unit Tests
        env:
          PYTHONPATH: src
        run: |
          uv run --locked --group tests pytest
