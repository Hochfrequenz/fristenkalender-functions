name: Publish Docker image to Github Container Registry GHCR
on:
  release:
    types:
      - created

# GITHUB_TOKEN needs write access to packages to push to GHCR; this replaces the former (expiring) personal access token
permissions:
  contents: read
  packages: write

jobs:
  push_to_registry:
    name: Push Docker image to GHCR
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: get version tag
        run: |
          VERSION=$(echo ${GITHUB_REF#refs/tags/})
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Update version.json
        run: |
          chmod +x ./scripts/update_version.sh
          ./scripts/update_version.sh
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Build and push
        run: |
          docker build --build-arg VERSION=$VERSION -t fristenkalender-functions:$VERSION .
          docker tag fristenkalender-functions:$VERSION ghcr.io/hochfrequenz/fristenkalender-functions:$VERSION
          docker tag fristenkalender-functions:$VERSION ghcr.io/hochfrequenz/fristenkalender-functions:latest
          docker push ghcr.io/hochfrequenz/fristenkalender-functions:$VERSION
          docker push ghcr.io/hochfrequenz/fristenkalender-functions:latest
