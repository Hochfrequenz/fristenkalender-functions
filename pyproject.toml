[project]
name = "fristenkalender-functions"
description = "A package that provides functions for the Hochfrequenz Fristenkalender, for the technical infrastrukture."
license = { text = "MIT" }
requires-python = ">=3.14" # if you have py 3.14 not installed, >=3.11 will most likely work too, it's just not tested
authors = [{ name = "Hochfrequenz Unternehmensberatung", email = "info+github@hochfrequenz.de" }]
keywords = ["fristenkalender", "bdew", "hochfrequenz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi[standard]==0.141.1",
    "fristenkalender-generator==1.0.6",
    "holidays==0.103",
    "fastmcp>=3.4.3",
]
dynamic = ["readme", "version"]

[dependency-groups]
tests = [
    "pytest==9.1.1",
    "httpx",
]
linting = [
    "ruff==0.16.3",
]
type_check = [
    "mypy==2.3.1",
    {include-group = "tests"},
]
spell_check = [
    "codespell==2.4.3",
]
coverage = [
    "coverage==7.15.4",
    {include-group = "tests"},
]
# aggregate group for local development; packaging is handled by native `uv build`/`uv publish`
dev = [
    "pre-commit",
    {include-group = "tests"},
    {include-group = "linting"},
    {include-group = "type_check"},
    {include-group = "spell_check"},
    {include-group = "coverage"},
]

[tool.uv]
default-groups = []

[project.urls]
Changelog = "https://github.com/Hochfrequenz/fristenkalender-functions/releases"
Homepage = "https://github.com/Hochfrequenz/fristenkalender-functions"

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "N",
    "PL",
    "RUF",
    "SIM",
    "C4",
    "PTH",
    "PT",
    "RET",
    "ARG",
    "TC",
    "PIE",
    "RSE",
    "ISC",
    "S",
]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "ISC001",  # single-line-implicit-string-concatenation (conflicts with ruff format)
]

[tool.ruff.lint.per-file-ignores]
# Standing globs (hand-written): cover files that do not exist yet.
"unittests/**" = [
    "S101",    # assert-used
    "PLR2004", # magic-value-comparison
]
# Generated grandfathering: pre-existing violations in files present at migration time.
# Zero lint churn on existing code; new/changed code is held to the full select set.
"src/app/main.py" = ["PT018", "PTH123", "S101", "UP015", "UP035"]                 # pytest-composite-assertion, builtin-open, assert, redundant-open-modes, deprecated-import
"src/app/mcp_server/__init__.py" = ["TC002", "UP035"]                            # typing-only-third-party-import, deprecated-import
"src/app/mcp_server/settings.py" = ["S101", "UP037"]                             # assert, quoted-annotation
"src/app/routers/calendar.py" = ["TC003"]                                        # typing-only-standard-library-import
"unittests/conftest.py" = ["PT003", "UP035", "UP043"]                            # pytest-extraneous-scope-function, deprecated-import, unnecessary-default-type-args
"unittests/test_calendar.py" = ["PT006"]                                         # pytest-parametrize-names-wrong-type
"unittests/test_generate_and_export_fristen_for_type.py" = ["PT006"]             # pytest-parametrize-names-wrong-type
"unittests/test_generate_and_export_whole_calendar.py" = ["PT006"]               # pytest-parametrize-names-wrong-type
"unittests/test_generate_fristen_for_type.py" = ["PT006"]                        # pytest-parametrize-names-wrong-type
"unittests/test_mcp_server.py" = ["PLC0415", "PT018", "S105", "UP035"]           # import-outside-top-level, pytest-composite-assertion, hardcoded-password-string, deprecated-import

[mypy]
truethy-bool = true

[tool.mypy]
disable_error_code = []

[build-system]
requires = ["hatchling>=1.31.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_your_package_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src/app"]
sources = ["src"]
