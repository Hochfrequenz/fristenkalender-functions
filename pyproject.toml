[project]
name = "fristenkalender-functions"
description = "A package that provides functions for the Hochfrequenz Fristenkalender, for the technical infrastrukture."
license = { text = "MIT" }
requires-python = ">=3.14" # if you have py 3.14 not installed, >=3.11 will most likely work too, it's just not tested
authors = [{ name = "Hochfrequenz Unternehmensberatung", email = "info+github@hochfrequenz.de" }]
keywords = ["fristenkalender", "bdew", "hochfrequenz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi[standard]==0.141.1",
    "fristenkalender-generator==1.0.5",
    "holidays==0.102",
    "fastmcp>=3.4.3",
]
dynamic = ["readme", "version"]

[dependency-groups]
tests = [
    "pytest==9.1.1",
    "httpx",
]
linting = [
    "pylint==4.0.6",
    {include-group = "tests"},
]
type_check = [
    "mypy==2.3.0",
    {include-group = "tests"},
]
spell_check = [
    "codespell==2.4.3",
]
coverage = [
    "coverage==7.15.4",
    {include-group = "tests"},
]
formatting = [
    "black==26.5.1",
    "isort==8.0.1",
]
# aggregate group for local development; packaging is handled by native `uv build`/`uv publish`
dev = [
    "pre-commit",
    {include-group = "tests"},
    {include-group = "linting"},
    {include-group = "type_check"},
    {include-group = "spell_check"},
    {include-group = "coverage"},
    {include-group = "formatting"},
]

[tool.uv]
default-groups = []

[project.urls]
Changelog = "https://github.com/Hochfrequenz/fristenkalender-functions/releases"
Homepage = "https://github.com/Hochfrequenz/fristenkalender-functions"

[tool.black]
line-length = 120
target_version = ["py314"]

[tool.isort]
line_length = 120
profile = "black"

[tool.pylint."MESSAGES CONTROL"]
max-line-length = 120

[mypy]
truethy-bool = true

[tool.mypy]
disable_error_code = []

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_your_package_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src/app"]
sources = ["src"]
